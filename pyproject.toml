[project]
name = "dailymail"
version = "0.1.0"
description = "Deterministic collector for Rowan Announcer announcements"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "certifi>=2024.2.2",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "nh3>=0.3.6",
]

[project.scripts]
dailymail = "dailymail.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dailymail"]
artifacts = ["src/dailymail/templates/*.j2", "src/dailymail/certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
